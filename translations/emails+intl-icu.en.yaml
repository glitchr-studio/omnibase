admin_forwarding:
  notice: "{0} forwarded its notification: `{1}`"

fake_test:
  author: "FAKE"
  notice: "This email was sent programmatically, the author might be referring to a fictive person for development purposes"

action_text: Go to the page
unsubscribe:  "Click <a href=\"{0}\">here</a> to unsubscribe"
returnIndex:  "Click <a href=\"{0}\">here</a> to return to home page"
itWorks: "It works!"

wallpaper_contact:
  subject: "Custom made wallpaper: new request"
  excerpt: "This is a message from `{0}`."
  content: "<b>{0}</b>. {1}"

wallpaper_contact_confirmation:
  subject: "Custom made wallpaper confirmation !"
  excerpt: "Dear {0}, we just received the message you sent us earlier today. Here is a transcript of your message"
  content: "<b>{0}</b>. {1}"

accountCreated:
    subject: "Your account is ready"
    content: "An account has just been created for you. Your username: <b>{0}</b>. Your temporary password: <b>{1}</b>. You will choose your own at your first sign-in."
    action_text: "Sign in"
    footer: "If you were not expecting this account, ignore this message."

resetPassword:
  subject: "Reset your password"
  content:
    "You are receiving this email, because you asked to reset your password.
    If it wasn't you please consider changing your password. Please visit the following link to reset your password."
  action_text: "Reset your password"
  expiry: "The link will expire in {0}"

register_notifyAdmins:
    subject: "New user registered"
    content: "Bravo ! A new user just registered. He is identified by <b>{0}</b> ({1})"
    action_text: "See the profile"

verifyEmail:
    subject: "Verify your email"
    content: "Bravo ! You are receiving this email because you successfully sign up to our website.
              Please confirm your email address by clicking the link below"
    action_text: "Confirm my Email"
    expiry: "The link will expire in {0}"

loginToken:
    subject: "Credential request"
    content: "You are receiving this email because you made a credential request.
              Click on the link below to login to your account."
    action_text: "Login"
    expiry: "The link will expire in {0}"

adminApproval:
  subject: "Validation requested"
  content: "<b>{0} #{1}</b> is ready for validation !"
  action_text: Go to dashboard

adminApprovalConfirm:
  subject: "Account approved"
  content: "Hi <b>{0}</b> ! Your account has been validated by an administrator. You can now sign in !
           Click on the link below to visit the website"
  action_text: Sign in!

accountWelcomeBack:
  subject: "Welcome back, {0} ! "
  content: "Long time no see ! We're so glad you're finally here.
           Click on the link below to update your profile and visit the website"
  action_text: Reactivate your account

accountGoodbye:
  subject: "Time to say goodbye, {0} !"
  content: "We're so sorry to see you leave. If you changed your mind just log back in !
           Click on the link below to return online"
  action_text: Sign back in !

thread:
  publish:
    subject: "`{1}` just got published"
    content: "This thead you scheduled just got released to the public"
    action_text: Go to see it !
    
  mention:
    subject: "Hey {0}, you must be thrilled !"
    content: "Your name has been mentioned in a new thread `{0}` !"
    action_text: Go to see it !
    
security_newDevice:
    subject: "New sign-in to your account"
    content: "Your account has just been used to sign in from a browser we had not seen before. If that was you, there is nothing to do."
    warning: "If it was not you, change your password straight away and sign that device out from your settings."
    action_text: "See my devices"
    field_date: "Date"
    field_agent: "Browser"
    field_ip: "IP address"
