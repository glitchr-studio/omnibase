# The guard of the forms (glitchr/omnishield, Base\Service\FormGuard): ALTCHA as the captcha -
# issued and checked by the site, its widget's script served by the site too
# (/omnishield/altcha/3.3.0/altcha.min.js, from omnishield/altcha: no CDN) - and the disposable
# e-mail domains asked at sign-up.
# The key is the harness's, known to everyone: never a site's.
omnishield:
    gateways:
        forms:
            factory: altcha
            options: { hmac_key: 'harness-hmac-key-known-to-everyone-not-a-secret' }
        emails:
            factory: disposable
    challenge:
        gateway: forms
        unreachable: reject

# The suites submit forms as a browser would: the fixed captcha's hidden field carries its token.
when@test:
    omnishield:
        gateways:
            forms: { factory: fixed }
