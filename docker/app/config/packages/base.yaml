# The smallest base config a host needs. The parameter_bag flags are not
# optional: with use_hot_bag unset, the decorated parameter bag resolves
# every lookup - even a plain container parameter - to null.
base:
    parameter_bag:
        use_hot_bag: true
        use_setting_bag: true
    database:
        use_custom: true
    router:
        use_custom: true
    attributes:
        use_custom: true
    twig:
        use_custom: true
        use_form2: true
        use_bootstrap: true
        editor:
            storage: "local.wysiwyg"
    uploader:
        storage: "local.uploads"
    site:
        index: demo_index
    # The forms' guard (docs/20-architecture/guard.md): the captcha is omniguard's default
    # (omniguard.challenge.gateway); the disposable e-mail domains are refused where an address is given.
    guard:
        reputation: [emails]

# The suites submit a form the moment they read it, and sign in wrong on purpose from one address:
# no delay, no captcha at the sign-in (FormGuardTest and SignInGuardTest check both).
when@test:
    base:
        guard:
            min_delay: 0
            sign_in_after: 0
