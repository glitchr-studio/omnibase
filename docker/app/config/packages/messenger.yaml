# No message is routed today: the marketplace's Shopify order push, which
# went through this transport, left with src/Shopify (omnitrade's catalogue
# replaces it). A message a plugin adds is routed here; in the harness the
# transport is synchronous, which is correct but does not retry - a real
# application routes to a doctrine:// or redis:// transport and runs
# messenger:consume.
framework:
    messenger:
        transports:
            async: 'sync://'
